<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audit trail · ChangSupport.AI</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>

<!-- @header -->

<main class="app-main">
  <div id="view-audit" class="ov">
    <div class="ov-head">
      <div class="ov-head-title">
        <h1>Audit trail</h1>
        <p class="ov-head-meta">
          <span>Append-only, SHA-256 hash-chained record of every tool call and decision</span>
          <span class="ov-sep" aria-hidden="true"></span>
          <span id="auUpdated" aria-live="polite">Loading…</span>
        </p>
      </div>
      <div class="pg-head-actions">
        <label class="pg-actor">Acting as
          <select id="auditAccount"></select>
        </label>
        <button type="button" class="btn btn-sm btn-secondary" id="verifyBtn">Verify chain</button>
        <button type="button" class="btn btn-sm btn-ghost" id="auditRefresh">Refresh</button>
      </div>
    </div>

    <div id="auRoleNote" class="pg-role-note" hidden></div>
    <div id="auTamper" class="pg-role-note pg-tamper" role="alert" hidden></div>

    <section class="ov-band pg-band-5" aria-label="Ledger state">
      <div class="ov-cell" id="auChainCell"><span class="ov-cell-label">Chain integrity</span><span class="ov-skel" style="width:50%"></span></div>
      <div class="ov-cell" id="auEntriesCell"><span class="ov-cell-label">Entries</span><span class="ov-skel" style="width:40%"></span></div>
      <div class="ov-cell" id="auBlockedCell"><span class="ov-cell-label">Blocked</span><span class="ov-skel" style="width:30%"></span></div>
      <div class="ov-cell" id="auEscalatedCell"><span class="ov-cell-label">Escalated</span><span class="ov-skel" style="width:30%"></span></div>
      <div class="ov-cell" id="auLastCell"><span class="ov-cell-label">Latest event</span><span class="ov-skel" style="width:60%"></span></div>
    </section>

    <section class="ov-panel" aria-labelledby="auLedgerTitle">
      <header class="ov-panel-head pg-ledger-head">
        <h2 id="auLedgerTitle">Ledger</h2>
        <div class="ov-seg" role="group" aria-label="Filter ledger">
          <button type="button" class="ov-seg-btn" data-ledger-filter="all" aria-pressed="true">All</button>
          <button type="button" class="ov-seg-btn" data-ledger-filter="notable" aria-pressed="false">Notable</button>
          <button type="button" class="ov-seg-btn" data-ledger-filter="BLOCKED" aria-pressed="false">Blocked</button>
          <button type="button" class="ov-seg-btn" data-ledger-filter="ESCALATED" aria-pressed="false">Escalated</button>
          <button type="button" class="ov-seg-btn" data-ledger-filter="tools" aria-pressed="false">Tool calls</button>
        </div>
        <input type="search" id="auSearch" class="pg-search" placeholder="Filter by actor, action, claim or hash" aria-label="Search the ledger">
        <span class="ov-panel-note" id="auCount" aria-live="polite"></span>
      </header>
      <div id="audit"><span class="ov-skel ov-skel--block"></span></div>
    </section>
  </div>
</main>

<!-- Accessible Live Toast -->
<div id="toast" role="status" aria-live="polite"></div>

<script src="/static/js/core.js" defer></script>
<script src="/static/js/pages/audit.js" defer></script>
</body>
</html>
